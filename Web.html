<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTZ Official | Cyber Team</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&family=Noto+Sans+Sinhala:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00ffcc;
            --secondary: #00d4ff;
            --bg-color: #020205;
            --glass: rgba(0, 255, 204, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: var(--bg-color); 
            color: white; 
            font-family: 'Noto Sans Sinhala', sans-serif; 
            overflow: hidden; 
            height: 100vh;
        }

        /* --- LOADING/TERMINAL OVERLAY --- */
        #terminal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 5000; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            font-family: 'Share Tech Mono', monospace; padding: 20px;
        }

        .terminal-text { color: var(--primary); font-size: 1rem; text-align: left; line-height: 1.8; width: 300px; }

        /* --- WELCOME SCREEN --- */
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0a1414 0%, #020205 100%);
            z-index: 1000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: 1.2s ease-in-out;
        }

        .dev-box {
            border: 2px solid var(--primary); background: var(--glass);
            padding: 25px 45px; text-align: center; margin-bottom: 30px;
            box-shadow: 0 0 25px var(--primary); border-radius: 15px;
            animation: pulse 2s infinite alternate;
        }

        .dev-box h3 { font-family: 'Orbitron'; font-size: 1rem; letter-spacing: 2px; color: white; margin-top: 10px; }
        
        @keyframes pulse { 
            from { transform: scale(1); box-shadow: 0 0 20px var(--primary); } 
            to { transform: scale(1.03); box-shadow: 0 0 50px var(--primary); } 
        }

        .dtz-title { font-family: 'Orbitron'; font-size: clamp(3rem, 10vw, 5rem); letter-spacing: 15px; margin-bottom: 10px; }
        .dtz-title span { color: var(--primary); text-shadow: 0 0 10px var(--primary); }

        .btn-init {
            background: transparent; border: 1px solid var(--primary);
            color: var(--primary); padding: 15px 50px; font-family: 'Orbitron';
            font-weight: bold; cursor: pointer; transition: 0.5s; font-size: 1.1rem;
            text-transform: uppercase;
        }
        .btn-init:hover { background: var(--primary); color: black; box-shadow: 0 0 40px var(--primary); }

        /* --- MAIN FORM SECTION --- */
        #main-portal {
            height: 100vh; display: none; justify-content: center; align-items: center;
            opacity: 0; transition: 1s; padding: 20px; overflow-y: auto;
        }

        .form-card {
            width: 100%; max-width: 500px; background: rgba(10, 15, 20, 0.98);
            border: 1px solid #333; padding: 35px; border-radius: 12px;
            border-top: 4px solid var(--primary); box-shadow: 0 0 60px rgba(0,0,0,1);
            position: relative;
        }

        h2 { font-family: 'Orbitron'; text-align: center; margin-bottom: 25px; color: white; letter-spacing: 4px; }

        label { display: block; color: var(--primary); font-size: 0.85rem; margin: 15px 0 5px; font-weight: bold; }
        
        input, select {
            width: 100%; padding: 14px; background: #000; border: 1px solid #222;
            color: white; border-left: 3px solid var(--primary); margin-bottom: 5px; border-radius: 4px;
        }

        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
        .photo-slot { background: #080808; padding: 12px; border: 1px dashed #444; text-align: center; border-radius: 5px; }
        .photo-slot input { border: none; font-size: 0.7rem; padding: 0; margin: 0; border-left: none; }

        .submit-btn {
            width: 100%; padding: 18px; background: var(--primary); border: none;
            font-family: 'Orbitron'; font-weight: bold; margin-top: 30px; cursor: pointer;
            color: black; font-size: 1rem; transition: 0.3s; text-transform: uppercase;
        }
        .submit-btn:hover { background: white; box-shadow: 0 0 30px white; transform: scale(1.02); }

        .footer { margin-top: 25px; text-align: center; color: #666; font-size: 0.75rem; border-top: 1px solid #222; padding-top: 15px; }
        
        /* Helper Classes */
        .slide-up { transform: translateY(-100%) !important; opacity: 0; pointer-events: none; }
        .show { display: flex !important; opacity: 1 !important; transform: translateY(0) !important; }
    </style>
</head>
<body>

    <div id="terminal-overlay">
        <div id="terminal-log" class="terminal-text"></div>
    </div>

    <div id="welcome-screen">
        <div class="dev-box">
            <p style="font-size: 0.65rem; color: var(--primary); font-family: 'Orbitron';">DEVELOPED BY</p>
            <h3>RAVIYA • SHAGIYA • ASHIYA</h3>
        </div>
        <h1 class="dtz-title">DT<span>Z</span></h1>
        <button class="btn-init" onclick="runBootSequence()">සම්බන්ධ වන්න</button>
        <p style="margin-top: 30px; color: #333; font-family: 'Share Tech Mono';">ESTABLISHING ENCRYPTED CONNECTION...</p>
    </div>

    <main id="main-portal">
        <div class="form-card">
            <h2>RECRUITMENT</h2>
            <form id="cyberForm">
                <label>👤 සම්පූර්ණ නම</label>
                <input type="text" id="name" required placeholder="ඔබේ නම මෙහි ලියන්න">
                
                <div style="display: flex; gap: 15px;">
                    <div style="flex:1">
                        <label>🏠 පදිංචි නගරය</label>
                        <input type="text" id="city" required placeholder="නගරය">
                    </div>
                    <div style="width: 100px;">
                        <label>🎂 වයස</label>
                        <input type="number" id="age" required>
                    </div>
                </div>

                <label>📱 වට්සැප් අංකය</label>
                <input type="tel" id="whatsapp" required placeholder="+94 7X XXX XXXX">

                <label>💻 අත්දැකීම් තිබේද?</label>
                <select id="exp">
                    <option value="නැත (පළමු වතාව)">නැත (පළමු වතාව)</option>
                    <option value="ඔව් (Experienced)">ඔව් (පළපුරුදු)</option>
                </select>

                <label>🖼️ ඡායාරූප 4ක් ලබා දෙන්න</label>
                <div class="photo-grid">
                    <div class="photo-slot"><input type="file" accept="image/*" required></div>
                    <div class="photo-slot"><input type="file" accept="image/*" required></div>
                    <div class="photo-slot"><input type="file" accept="image/*" required></div>
                    <div class="photo-slot"><input type="file" accept="image/*" required></div>
                </div>

                <button type="submit" class="submit-btn">දත්ත යොමු කරන්න</button>
            </form>
            <div class="footer">
                Developed by <span style="color: var(--primary);">RAVIYA, SHAGIYA, ASHIYA</span><br>
                DARK TECH ZONE OFFICIAL © 2025
            </div>
        </div>
    </main>

    <script>
        const logElement = document.getElementById('terminal-log');
        const terminal = document.getElementById('terminal-overlay');

        // Professional Boot Sequence
        async function runBootSequence() {
            document.getElementById('welcome-screen').classList.add('slide-up');
            terminal.style.display = 'flex';
            
            const logs = [
                "> INITIALIZING SYSTEM...",
                "> BYPASSING FIREWALL...",
                "> RAVIYA ACCESS: GRANTED",
                "> SHAGIYA ACCESS: GRANTED",
                "> ASHIYA ACCESS: GRANTED",
                "> SECURE CHANNEL: ACTIVE",
                "> LOADING DATA INTERFACE..."
            ];

            for (let log of logs) {
                logElement.innerHTML += `<p>${log}</p>`;
                await new Promise(r => setTimeout(r, 400));
            }

            setTimeout(() => {
                terminal.style.display = 'none';
                document.getElementById('main-portal').classList.add('show');
                document.body.style.overflow = "auto";
            }, 600);
        }

        // WhatsApp Submission Logic
        document.getElementById('cyberForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const adminNumber = "94778430626";

            terminal.style.display = 'flex';
            logElement.innerHTML = "";
            const submitLogs = [
                "> DATA ENCRYPTION IN PROGRESS...",
                "> UPLOADING 4 MEDIA FILES...",
                "> CONNECTING TO DTZ HQ...",
                "> REDIRECTING TO WHATSAPP..."
            ];

            for (let log of submitLogs) {
                logElement.innerHTML += `<p style="color:white">${log}</p>`;
                await new Promise(r => setTimeout(r, 600));
            }

            const message = `*🛡️ DTZ RECRUITMENT REPORT 🛡️*%0A%0A` +
                            `👤 *නම:* ${name}%0A` +
                            `📍 *නගරය:* ${document.getElementById('city').value}%0A` +
                            `🎂 *වයස:* ${document.getElementById('age').value}%0A` +
                            `📱 *WhatsApp:* ${document.getElementById('whatsapp').value}%0A` +
                            `💻 *අත්දැකීම්:* ${document.getElementById('exp').value}%0A%0A` +
                            `*කරුණාකර මා එවූ ඡායාරූප 4 පරීක්ෂා කරන්න.*%0A%0A` +
                            `_Developed by Raviya, Shagiya, Ashiya_`;

            window.location.href = `https://wa.me/${adminNumber}?text=${message}`;
        });
    </script>
</body>
    </html>
